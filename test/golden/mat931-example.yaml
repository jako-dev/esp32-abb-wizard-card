# ABB-Welcome Wizard – generierte ESPHome-Konfiguration
# Innenstation: 0x100c, Wohnung 12
# Adresslänge: 2 Byte
#
# Diese Abschnitte ersetzen die gleichnamigen Abschnitte der Demo-Firmware:
# esphome.on_boot, remote_receiver.on_abbwelcome, binary_sensor und lock.
# Alle übrigen Einstellungen (wifi, api, ota, remote_transmitter, Pins von
# remote_receiver, text_sensor ...) unverändert lassen.
#
# Voraussetzung (in der Demo-Firmware bereits gesetzt):
# esp32:
#   framework:
#     type: esp-idf
#
# ACHTUNG: "data" der Öffnen-Befehle ist euer TÜRCODE – nicht öffentlich teilen!

esphome:
  on_boot:
    - binary_sensor.template.publish:
        id: klingel_haustuer
        state: OFF
    - binary_sensor.template.publish:
        id: klingel_wohnungstuer
        state: OFF
    - lock.template.publish:
        id: haustuer
        state: LOCKED

remote_receiver:
  # pin, dump, filter, tolerance, idle, buffer_size ... aus der bestehenden Konfiguration
  on_abbwelcome:
    then:
      # Debug-Textsensor (id ggf. an eure Firmware anpassen)
      - lambda: 'char buf[192]; x.format_to(buf, 192); id(doorbell_intercom).publish_state(buf);'
      # Klingel Haustür – Außenstation #1 (0x2001)
      - if:
          condition:
            or:
              # Typ 01: Außenstation #1 (0x2001) > Innenstation #12 (0x100c) (3/3 Aufnahmen)
              - lambda: 'return (x.get_message_type() == 0x01) && (x.get_source_address() == 0x2001) && (x.get_destination_address() == 0x100c);'
              # Typ 81: Innenstation #12 (0x100c) > Außenstation #1 (0x2001) (3/3 Aufnahmen)
              - lambda: 'return (x.get_message_type() == 0x81) && (x.get_source_address() == 0x100c) && (x.get_destination_address() == 0x2001);'
              # Typ 0A: Außenstation #1 (0x2001) > Gateway (0x3001), Data: 01 10 0C (3/3 Aufnahmen)
              - lambda: 'std::vector<uint8_t> d = {0x01, 0x10, 0x0c}; return (x.get_message_type() == 0x0a) && (x.get_source_address() == 0x2001) && (x.get_destination_address() == 0x3001) && (x.get_data() == d);'
          then:
            - binary_sensor.template.publish:
                id: klingel_haustuer
                state: ON
            - binary_sensor.template.publish:
                id: klingel_haustuer
                state: OFF
      # Klingel Wohnungstür
      - if:
          condition:
            or:
              # Typ 11, Quelle: Innenstation #12 (0x100c) (2/2 Aufnahmen)
              - lambda: 'return (x.get_message_type() == 0x11) && (x.get_source_address() == 0x100c);'
              # Typ 91, Ziel: Innenstation #12 (0x100c) (2/2 Aufnahmen)
              - lambda: 'return (x.get_message_type() == 0x91) && (x.get_destination_address() == 0x100c);'
          then:
            - binary_sensor.template.publish:
                id: klingel_wohnungstuer
                state: ON
            - binary_sensor.template.publish:
                id: klingel_wohnungstuer
                state: OFF
      # Haustür geöffnet (Bestätigung Typ 8D)
      - if:
          condition:
            and:
              - lambda: 'return (x.get_message_type() == 0x8d);'
              - lambda: 'return (x.get_source_address() == 0x4001);'
              - lambda: 'return (x.get_destination_address() == 0x100c);'
          then:
            - lock.template.publish:
                id: haustuer
                state: UNLOCKING
            - delay: 3s
            - lock.template.publish:
                id: haustuer
                state: LOCKED

binary_sensor:
  - platform: template
    name: "Klingel Haustür"
    id: klingel_haustuer
    icon: mdi:bell
    filters:
      - delayed_off: 1s
  - platform: template
    name: "Klingel Wohnungstür"
    id: klingel_wohnungstuer
    icon: mdi:bell
    filters:
      - delayed_off: 1s

lock:
  - platform: template
    name: "Haustür"
    id: haustuer
    icon: mdi:door
    lock_action:
      - lock.template.publish:
          id: haustuer
          state: LOCKED
    unlock_action:
      - remote_transmitter.transmit_abbwelcome:
          source_address: 0x100c # Innenstation
          destination_address: 0x4001 # Türsteuergerät (0x4001)
          three_byte_address: false
          message_type: 0x0d # Türöffner
          data: [0xab, 0xcd, 0xef] # TÜRCODE – nicht öffentlich teilen!
